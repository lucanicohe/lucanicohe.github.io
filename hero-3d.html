<style>

<script type="module">
import * as THREE from "three";
const $=id=>document.getElementById(id),root=$("uh"),html=document.documentElement;

$("lang").onclick=()=>setLang(window.__lang==="ja"?"en":"ja");setLang(window.__lang);

/* loader -> enter */
let n=0,started=false,t0=0;const iv=setInterval(()=>{n=Math.min(100,n+3+Math.random()*5|0);$("pct").textContent=n;if(n>=100){clearInterval(iv);setTimeout(()=>$("intro").classList.add("ready"),200)}},60);

/* renderer, targets */

/* sky (also used for image-based light) */

uniforms:{a:{value:C("#7b4fb0")},b:{value:C("#2d2a7a")},c:{value:C("#080a2e")},uTime:T0.uTime},
vertexShader:"varying vec3 v;void main(){v=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}",
fragmentShader:"varying vec3 v;uniform vec3 a,b,c;uniform float uTime;float H(vec3 p){return fract(sin(dot(p,vec3(12.9898,78.233,37.719)))*43758.5453);}"+
"void main(){vec3 n=normalize(v);float h=n.y;vec3 x=mix(a,b,smoothstep(0.,.3,h));x=mix(x,c,smoothstep(.25,.85,h));vec3 g=floor(n*700.);float st=step(.9988,H(g))*(.5+.5*sin(uTime*2.+H(g+1.)*40.))*smoothstep(.05,.3,h);"+
"float au=pow(max(0.,sin(n.x*4.+sin(n.z*3.+uTime*.12)*1.5+uTime*.08)),3.)*smoothstep(.18,.4,h)*(1.-smoothstep(.45,.85,h));x+=vec3(.15,.9,.75)*au*.28+vec3(.6,.25,.95)*au*au*.3+vec3(1.,.95,.85)*st;gl_FragColor=vec4(x,1.);}"}))}

"for(int i=0;i<8;i++){vec4 p=uRp[i];float a=uTime-p.z;if(p.w<.5||a<0.||a>4.)continue;vec2 v=w.xz-p.xy;float r=length(v),f=r-a*1.6;d+=normalize(v+1e-4)*sin(f*16.)*exp(-f*f*5.)*exp(-a*.9)*.7;}"+
"vec4 q=uTexM*vec4(w,1.);vec2 uv=q.xy/q.w+d*vec2(.006,.022);vec3 rf=texture2D(uRef,uv).rgb;float fr=pow(1.-max(normalize(cameraPosition-w).y,0.),3.);vec3 c=mix(uTint,rf,.62+.35*fr);c+=vec3(.5,.45,1.)*pow(abs(d.y),2.)*.5;gl_FragColor=vec4(c,1.);}"}));

const TP=[];for(let i=0;i<6;i++)TP.push(new THREE.Vector4(0,0,-99,0));let ti=0;const lu=new THREE.Vector2(9,9);

const ringEl=$("ring"),rg={x:-99,y:-99,tx:-99,ty:-99};

/* dream lanterns + kiwi */
const LN=240,lp=new Float32Array(LN*3),lr=new Float32Array(LN*4);
for(let i=0;i<LN;i++){lp.set([(Math.random()-.5)*34,Math.random()*11,-8+Math.random()*20],i*3);lr.set([Math.random(),Math.random(),Math.random(),.5+Math.random()],i*4)}

const lanterns=new THREE.Points(lg,new THREE.ShaderMaterial({transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,uniforms:{uTime:T0.uTime,uPx:{value:dpr}},

const body=new THREE.Mesh(new THREE.SphereGeometry(.5,32,24),km);body.scale.set(1.25,1,1.05);body.position.y=.82;

[.12,-.12].forEach(z=>{const e=new THREE.Mesh(new THREE.SphereGeometry(.028,10,8),dk);e.position.set(-.1,.06,z);head.add(e)});
head.add(new THREE.Mesh(new THREE.SphereGeometry(.17,24,16),km),beak);
const legs=[.16,-.16].map(z=>{const l=new THREE.Mesh(new THREE.CylinderGeometry(.025,.025,.34,8),bm);l.position.set(-.08,.17,z);return l});
kiwi.add(body,head,...legs);kiwi.traverse(o=>{if(o.isMesh)o.receiveShadow=true});kiwi.scale.setScalar(.8);kiwi.position.set(-2.4,.54,-3.05);scene.add(kiwi);

/* post: chromatic aberration, vignette, grain */
const post=new THREE.Scene(),pcam=new THREE.OrthographicCamera(-1,1,1,-1,0,1);
post.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2),new THREE.ShaderMaterial({depthTest:false,uniforms:{t:{value:rt.texture},uTime:T0.uTime,uHold:T0.uHold},
vertexShader:"varying vec2 u;void main(){u=uv;gl_Position=vec4(position.xy,0.,1.);}",
fragmentShader:"uniform sampler2D t;uniform float uTime,uHold;varying vec2 u;float h(vec2 p){return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453);}void main(){vec2 d=u-.5;float r=dot(d,d);vec2 o=d*r*(.03+uHold*.03);vec3 c=vec3(texture2D(t,u+o).r,texture2D(t,u).g,texture2D(t,u-o).b);c*=1.-r*.6;c+=(h(u*vec2(1920.,1080.)+uTime)-.5)*.03;gl_FragColor=vec4(c,1.);\n#include <colorspace_fragment>\n}"})));

/* interaction */
let yaw=0,pitch=0,ty=0,tp=0,mx=0,my=0,drag=false,hold=0,holding=false,lx=0,ly=0,ri=0,sx=1e9,sz=1e9;
const hit=new THREE.Vector3(),ray=new THREE.Raycaster(),pl=new THREE.Plane(new THREE.Vector3(0,1,0),0),ndc=new THREE.Vector2();
root.addEventListener("pointerdown",ev=>{if(ev.target.closest("button,a")||!started)return;drag=holding=true;lx=ev.clientX;ly=ev.clientY;root.classList.add("drag");root.setPointerCapture(ev.pointerId)});
const up=()=>{drag=holding=false;root.classList.remove("drag")};root.addEventListener("pointerup",up);root.addEventListener("pointercancel",up);
root.addEventListener("pointermove",ev=>{const b=root.getBoundingClientRect();ndc.set((ev.clientX-b.left)/b.width*2-1,-((ev.clientY-b.top)/b.height)*2+1);mx=ndc.x;my=ndc.y;rg.tx=ev.clientX-b.left;rg.ty=ev.clientY-b.top;
if(drag){ty=Math.max(-.4,Math.min(.4,ty+(ev.clientX-lx)*.0016));tp=Math.max(-.06,Math.min(.12,tp+(ev.clientY-ly)*.0008));lx=ev.clientX;ly=ev.clientY}
ray.setFromCamera(ndc,cam);const th=started?ray.intersectObject(textMesh)[0]:null;if(th&&th.uv&&Math.hypot(th.uv.x-lu.x,th.uv.y-lu.y)>.012){lu.copy(th.uv);TP[ti].set(th.uv.x,th.uv.y,T0.uTime.value,1);ti=(ti+1)%6}
if(started&&ray.ray.intersectPlane(pl,hit)&&Math.hypot(hit.x-sx,hit.z-sz)>.5&&hit.z>-6&&hit.z<9){sx=hit.x;sz=hit.z;RP[ri].set(hit.x,hit.z,T0.uTime.value,1);ri=(ri+1)%8}});

/* size + loop */
function size(){const w=root.clientWidth,h=root.clientHeight;R.setPixelRatio(dpr);R.setSize(w,h,false);rt.setSize(w*dpr,h*dpr);rr.setSize(w*dpr*.5,h*dpr*.5);cam.aspect=w/h;cam.updateProjectionMatrix()}
addEventListener("resize",size);size();
let vis=true,last=performance.now();new IntersectionObserver(a=>vis=a[0].isIntersecting).observe(root);
function frame(now){requestAnimationFrame(frame);if(!vis)return;const dt=Math.min(.05,(now-last)/1000);last=now;ema+=(dt-ema)*.05;if(started&&++fc%90===0&&ema>.026&&dpr>.7){dpr=Math.max(.7,dpr*.85);size()}T0.uTime.value+=dt;const T=T0.uTime.value;
const it=started?Math.min(1,(now-t0)/3800):0,ie=1-Math.pow(1-it,3);
hold+=((holding?1:0)-hold)*Math.min(1,dt*3);T0.uHold.value=hold;yaw+=(ty-yaw)*.06;pitch+=(tp-pitch)*.06;
cam.position.set(-yaw*5+mx*.45+Math.sin(T*.2)*.15,1.55+my*.12+(1-ie)*1.2,11+(1-ie)*7-hold*2.4);
cam.rotation.set(.085+pitch-my*.012,yaw-mx*.02,0);
cam.fov=46+(1-ie)*8-hold*7;cam.updateProjectionMatrix();
pearl.position.set(3.1+mx*.25,3.5+Math.sin(T*.8)*.2,-3.2);pearl.rotation.y=T*.15;head.rotation.z=Math.pow(Math.max(0,Math.sin(T*1.6)),6)*.7;body.scale.y=1+Math.sin(T*2)*.02;
textMat.uniforms.uRev.value=started?Math.min(1,Math.max(0,(now-t0-1500)/2600)):0;textMesh.rotation.set(my*.03,-mx*.06+yaw*.5,0);rg.x+=(rg.tx-rg.x)*.2;rg.y+=(rg.ty-rg.y)*.2;ringEl.style.transform="translate("+rg.x+"px,"+rg.y+"px) rotate(-12deg)";
/* reflection pass: mirror the whole world about the water plane */
if(!warm){warm=true;R.shadowMap.needsUpdate=true;R.setRenderTarget(rt);R.render(scene,cam)}
cam.updateMatrixWorld();rc.position.set(cam.position.x,-cam.position.y,cam.position.z);fw.set(0,0,-1).applyQuaternion(cam.quaternion);fw.y*=-1;rc.up.set(0,-1,0);rc.lookAt(tg.copy(rc.position).add(fw));rc.fov=cam.fov;rc.aspect=cam.aspect;rc.updateProjectionMatrix();rc.updateMatrixWorld();
tm.set(.5,0,0,.5,0,.5,0,.5,0,0,.5,.5,0,0,0,1).multiply(rc.projectionMatrix).multiply(rc.matrixWorldInverse);water.material.uniforms.uTexM.value.copy(tm);
water.visible=textMesh.visible=false;R.clippingPlanes=CP;R.setRenderTarget(rr);R.render(scene,rc);R.clippingPlanes=NP;water.visible=textMesh.visible=true;
R.setRenderTarget(rt);R.render(scene,cam);R.setRenderTarget(null);R.render(post,pcam)}
